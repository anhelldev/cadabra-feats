<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Demo del element de admin (tema WordPress simulado)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <style>
    /* CSS "hostil" tipo tema de WordPress: si algo de esto se filtra al panel, el aislamiento falló. */
    * { box-sizing: content-box; }
    body { font-family: Georgia, serif; font-size: 22px; line-height: 2; color: #222; background: #eef; letter-spacing: .04em; text-transform: uppercase; }
    h1, h2, h3, p { margin: 1em 0; color: crimson; }
    button, input, select { border: 3px dashed red !important; background: yellow !important; border-radius: 0 !important; font-size: 30px !important; }
    a { color: green; text-decoration: none; }
    .contenido { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  </style>
</head>
<body>
  <div class="contenido">
    <h1>Página privada de WordPress simulada</h1>
    <cadabra-admin></cadabra-admin>
  </div>
  <script type="module" src="/elements/admin/main.js"></script>
</body>
</html>
